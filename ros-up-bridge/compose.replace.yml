# ros-up-bridge, mode "replace": Gazebo replaces window-controller-sim and
# child-presence-sim.
#
#   docker compose -f docker-compose.yml -f ros-up-bridge/compose.replace.yml --profile gazebo up --build
#   (add -f gazebo-sim/compose.gui.yml after this file for the Linux GUI)
#
# window-controller-sim and child-presence-sim are moved into the profile
# "replaced-by-gazebo", which is never activated, so they do not start and
# there is exactly one publisher per topic (check-single-publisher.sh).
# "!override" replaces the depends_on lists that named window-controller-sim;
# it needs Docker Compose >= 2.24 and probably does not work with
# podman-compose. docker-compose.yml itself is unchanged.
services:
  window-controller-sim:
    profiles:
      - replaced-by-gazebo

  child-presence-sim:
    profiles:
      - replaced-by-gazebo

  temperature-sim:
    depends_on: !override
      - guardian
      - zenohd

  cda-sim:
    depends_on: !override
      - zenohd

  # Only relevant with --profile ros2 (HVAC via Eclipse Muto): same edit, so
  # replace mode and the ROS 2 HVAC path can run together.
  ros2-hvac:
    depends_on: !override
      - artifact-server
      - zenohd

  # extends ros2-hvac and would inherit the dependency on window-controller-sim
  ros2-hvac-host-can:
    depends_on: !override []

  gazebo-sim:
    environment:
      ROS_UP_BRIDGE_MODE: replace
      ROS_UP_BRIDGE_CONFIG: /opt/ros_up_bridge/config/replace.yaml
      ZENOH_CONNECT: tcp/zenohd:7447

  ros-up-mapper:
    build:
      context: .
      dockerfile: ros-up-bridge/Dockerfile
    image: hack-to-the-future/ros-up-mapper:stage-bridge
    command: ["--config", "/opt/ros_up_bridge/config/replace.yaml"]
    environment:
      # test-replace.sh sets ros_up_mapper=debug,info to see every publish
      RUST_LOG: ${ROS_UP_MAPPER_LOG:-ros_up_mapper=info,info}
      ZENOH_CONNECT: tcp/zenohd:7447
      # 1 = exit with code 1 when a second publisher shows up (the tests set
      # it); default: log, /health unhealthy, count in /stats, keep running.
      ROS_UP_STRICT_SINGLE_PUBLISHER: ${ROS_UP_STRICT_SINGLE_PUBLISHER:-0}
    ports:
      - "8092:8092"                    # GET /state, /health like window-controller-sim
    depends_on:
      - zenohd
    profiles:
      - gazebo
