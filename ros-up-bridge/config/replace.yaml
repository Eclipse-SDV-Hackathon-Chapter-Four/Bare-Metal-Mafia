# ros-up-bridge mapping, mode "replace".
#
# Gazebo replaces window-controller-sim and child-presence-sim (they must not
# run; compose.replace.yml takes care of that):
#   - window: uds/window/cmd (what window-controller-sim consumed) drives the
#     Gazebo joint; the window state on uProtocol (same JSON schema as
#     window-controller-sim) is derived from the joint position
#   - child presence: the row-2 seat contact sensor, debounced, plus heartbeat
#
# Format: see ros-up-bridge/README.md ("Mapping format").
version: 1
mode: replace

zenoh:
  key_prefix: ros_up_bridge

constants:
  window:
    file: /opt/gazebo_sim/config/window.yaml
    path: window_row2_left

links:
  - name: window_position_cmd
    direction: to_ros
    ros:
      topic: /sim/window/row2_left/position_cmd
      type: std_msgs/msg/Float64
  - name: joint_states
    direction: from_ros
    max_rate_hz: 10                    # Gazebo publishes every physics step
    ros:
      topic: /sim/joint_states
      type: sensor_msgs/msg/JointState
  - name: seat_contact
    direction: from_ros
    max_rate_hz: 20                    # ~1 kHz while in contact, silent otherwise
    ros:
      topic: /sim/seat/row2/contact
      type: ros_gz_interfaces/msg/Contacts

routes:
  # uds/window/cmd {request_id, percentage} -> Gazebo setpoint in metres.
  - name: window_command
    kind: forward
    from: {uprotocol: uds_window_cmd}
    to: {link: window_position_cmd}
    repeat_last_ms: 1000
    fields:
      data:
        from: percentage
        ops:
          - {clamp: [0, 100]}
          - {div: 100}
          - {mul: "${window.travel_m}"}
          - {add: "${window.closed_position_m}"}
        type: f64

  # Window state, same schema as window-controller-sim's WindowStateEvent:
  # {window_percentage: u8, alarm_enabled: bool, timestamp_ms: u64}.
  # window-controller-sim published on start and on every window or alarm
  # command; this route does the same, and additionally while the glass
  # moves (only on a change of >= 1 percentage point, at most 5 Hz, the
  # final value always follows). Bursts are coalesced into one event.
  - name: window_state
    kind: state
    initial:
      window_percentage: 0
      alarm_enabled: false
    inputs:
      - name: joint
        from: {link: joint_states}
        set:
          window_percentage:
            from: "position[name==${window.joint_name}]"
            ops:
              - {sub: "${window.closed_position_m}"}
              - {div: "${window.travel_m}"}
              - {mul: 100}
              - round
              - {clamp: [0, 100]}
            type: u8
      - name: window_command
        from: {uprotocol: uds_window_cmd}
        publish: true
      - name: alarm_command
        from: {uprotocol: uds_alarm_cmd}
        publish: true
        set:
          alarm_enabled: {from: enabled, type: bool}
    publish:
      on_start: true
      on_change:
        window_percentage: {min_delta: 1}
        alarm_enabled: {}
      max_rate_hz: 5
      coalesce_ms: 20
    to: {uprotocol: vss_window_state}
    fields:
      window_percentage: {state: window_percentage, type: u8}
      alarm_enabled: {state: alarm_enabled, type: bool}
      timestamp_ms: {now_ms: true}
    http:                              # like window-controller-sim's GET /state
      path: /state
      fields: [window_percentage, alarm_enabled]

  # Seat contact -> ChildPresenceEvent {present, confidence, zone, timestamp_ms}.
  # Gazebo publishes contacts only while something touches the cushion, so
  # "no message for silence_ms" means empty. The contact sensor has no real
  # confidence; 1.0 states that the simulated sensor is taken as ground
  # truth. zone rear_center matches child-presence-sim and the child seat's
  # position in the middle of the row-2 bench.
  - name: child_presence
    kind: presence
    from: {link: seat_contact}
    silence_ms: 300
    debounce_ms: 400
    heartbeat_ms: 1000
    to: {uprotocol: vss_child_presence}
    fields:
      present: {state: present, type: bool}
      confidence: {const: 1.0}
      zone: {const: rear_center}
      timestamp_ms: {now_ms: true}

http:
  port: 8092                           # same port as window-controller-sim
