# ros-up-bridge mapping, mode "mirror".
#
# Gazebo only follows the existing stack: the rear-left window state that
# window-controller-sim publishes on uProtocol drives the Gazebo window
# joint. Nothing is published on uProtocol in this mode (ros_up_mapper
# refuses to load a mirror file with a uProtocol output).
#
# Format: see ros-up-bridge/README.md ("Mapping format").
version: 1
mode: mirror

zenoh:
  key_prefix: ros_up_bridge            # Zenoh keys: ros_up_bridge/<link name>

# Values loaded from other files, used below as ${window.<key>}. The window
# percent <-> metres mapping is defined only in gazebo-sim/config/window.yaml.
constants:
  window:
    file: /opt/gazebo_sim/config/window.yaml
    path: window_row2_left

# ROS 2 <-> Zenoh (read by ros_zenoh_bridge.py in the gazebo-sim container).
links:
  - name: window_position_cmd
    direction: to_ros
    ros:
      topic: /sim/window/row2_left/position_cmd
      type: std_msgs/msg/Float64

# Zenoh <-> uProtocol (read by ros_up_mapper).
routes:
  - name: mirror_window_position
    kind: forward
    from: {uprotocol: vss_window_state}  # WindowStateEvent from window-controller-sim
    to: {link: window_position_cmd}
    # Re-send the last setpoint every second: window-controller-sim publishes
    # only on change and uProtocol keeps no last value, so a lost message
    # would otherwise leave Gazebo wrong until the next change.
    repeat_last_ms: 1000
    fields:
      data:
        from: window_percentage
        ops:
          - {div: 100}
          - {mul: "${window.travel_m}"}
          - {add: "${window.closed_position_m}"}
        type: f64

http:
  port: 8096                           # /health, /stats
