# ros-up-bridge, mode "mirror": Gazebo follows window-controller-sim.
#
#   docker compose -f docker-compose.yml -f ros-up-bridge/compose.mirror.yml --profile gazebo up --build
#   (add -f gazebo-sim/compose.gui.yml after this file for the Linux GUI)
#
# The default stack is unchanged; the bridge only subscribes on uProtocol.
services:
  gazebo-sim:
    environment:
      ROS_UP_BRIDGE_MODE: mirror
      ROS_UP_BRIDGE_CONFIG: /opt/ros_up_bridge/config/mirror.yaml
      ZENOH_CONNECT: tcp/zenohd:7447

  ros-up-mapper:
    build:
      context: .
      dockerfile: ros-up-bridge/Dockerfile
    image: hack-to-the-future/ros-up-mapper:stage-bridge
    command: ["--config", "/opt/ros_up_bridge/config/mirror.yaml"]
    environment:
      RUST_LOG: ros_up_mapper=info,info
      ZENOH_CONNECT: tcp/zenohd:7447
    ports:
      - "8096:8096"
    depends_on:
      - zenohd
    profiles:
      - gazebo
