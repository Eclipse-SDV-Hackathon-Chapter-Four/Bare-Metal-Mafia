# Single source of truth for the simulated rear-left window (row 2, left).
#
# Window opening is expressed in percent everywhere outside Gazebo:
#
#   joint_position_m = closed_position_m + (percent / 100) * travel_m
#
#     0 %  -> closed_position_m             (glass fully up, window closed)
#   100 %  -> closed_position_m + travel_m  (glass fully down, window open)
#
# The prismatic joint axis points down, so a larger position means a wider
# opening. The launch file writes travel_m into the joint's upper limit in
# worlds/cabin.sdf at start-up, and bridge/ros_zenoh_bridge.py uses the
# same values to convert percent to metres. Change it here and nowhere else.
#
# travel_m must not exceed 0.40: that is the height of the window opening and
# of the door panel the glass slides into.
window_row2_left:
  joint_name: window_row2_left_joint
  closed_position_m: 0.0
  travel_m: 0.40
